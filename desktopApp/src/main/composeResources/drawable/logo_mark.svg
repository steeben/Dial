<svg xmlns="http://www.w3.org/2000/svg" width="12" height="16.5" viewBox="0 0 160 220">
  <!-- Dial's mark: the bare 3x4 grid (app/src/main/res/drawable/ic_dial_logo.xml). -->
  <rect x="0" y="0" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="60" y="0" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="120" y="0" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="0" y="60" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="60" y="60" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="120" y="60" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="0" y="120" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="60" y="120" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="120" y="120" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="0" y="180" width="40" height="40" rx="8" fill="#FFFFFF" fill-opacity="1"/>
